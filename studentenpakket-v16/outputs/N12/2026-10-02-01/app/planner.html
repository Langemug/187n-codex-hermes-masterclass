<!doctype html><html lang="nl"><meta charset="utf-8"><title>Oefenplanner (lokaal)</title>
<style>body{font-family:monospace;background:#07040d;color:#eee;max-width:760px;margin:30px auto}label{display:block;margin:8px 0}input,select,textarea{width:100%;background:#120c1f;color:#fff;border:1px solid #a855f7;padding:6px}button{margin-top:10px;padding:8px 16px;background:#a855f7;color:#fff;border:0}#err{color:#ff6b6b}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{border:1px solid #333;padding:4px;font-size:12px}</style>
<h1>Oefenplanner · LOKAAL · geen publicatie</h1>
<form id="f"><label>ID <input name="id"></label>
<label>Kanaal <select name="kanaal"><option value="">—</option><option>Instagram carrousel</option><option>Instagram Reel</option><option>Meta ad (statisch)</option></select></label>
<label>Copy <textarea name="copy" rows="3"></textarea></label>
<label>Asset (pad) <input name="asset"></label>
<label>Datum <input name="datum" type="date"></label>
<label>Status <select name="status"><option>Concept</option></select></label>
<button type="submit" id="save">Opslaan als concept</button><p id="err" role="alert"></p></form>
<table><thead><tr><th>ID</th><th>Kanaal</th><th>Copy</th><th>Asset</th><th>Datum</th><th>Status</th></tr></thead><tbody id="list"></tbody></table>
<script>
const K='oefenplanner-v1',get=()=>JSON.parse(localStorage.getItem(K)||'[]'),f=document.querySelector('#f');
function draw(){document.querySelector('#list').innerHTML=get().map(i=>`<tr data-id="${i.id}"><td>${i.id}</td><td>${i.kanaal}</td><td>${i.copy}</td><td>${i.asset}</td><td>${i.datum}</td><td>${i.status}</td></tr>`).join('')}
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const miss=['id','kanaal','copy','asset','datum'].filter(k=>!d[k]);
 if(miss.length){document.querySelector('#err').textContent='Ontbrekende velden: '+miss.join(', ');return}
 d.status='Concept';const l=get().filter(i=>i.id!==d.id);l.push(d);localStorage.setItem(K,JSON.stringify(l));document.querySelector('#err').textContent='Opgeslagen: '+d.id;f.reset();draw()};
draw();</script></html>
