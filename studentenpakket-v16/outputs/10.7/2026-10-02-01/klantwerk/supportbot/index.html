<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visionair Society — Support (demo)</title>
<style>body{margin:0;background:#0b0b0b;color:#eee;font:15px/1.5 system-ui,Arial,sans-serif}.bar{background:#c00;color:#fff;font-size:12px;text-align:center;padding:6px}
#chat{max-width:560px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:70vh}.m{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.u{align-self:flex-end;background:#b57cff;color:#000}.b{align-self:flex-start;background:#1c1c1c}.src{display:block;font-size:11px;color:#999;margin-top:4px}
form{position:sticky;bottom:0;background:#0b0b0b;max-width:560px;margin:auto;padding:12px 16px;display:flex;gap:8px}input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#eee}button{padding:10px 14px;border:0;border-radius:8px;background:#b57cff;font-weight:700}</style></head><body>
<div class="bar">DEMO · answers from the knowledge base + TEST orders only · no live order access · nothing is sent</div>
<div id="chat"></div>
<form onsubmit="ask(event)"><input id="q" placeholder="Ask about sizes, returns, restock or your order…" autocomplete="off"><button>Send</button></form>
<script src="data.js"></script><script src="bot.js"></script>
<script>
const chat=document.getElementById('chat');
function show(t,who,src){const d=document.createElement('div');d.className='m '+who;d.textContent=t;if(src){const s=document.createElement('span');s.className='src';s.textContent=src;d.appendChild(s)}chat.appendChild(d);d.scrollIntoView()}
show('Hi! I answer questions about The Founding Member Hoodie and TEST orders. For anything else I hand you over to a team member.','b');
function ask(e){e.preventDefault();const q=document.getElementById('q');if(!q.value.trim())return;show(q.value,'u');const r=antwoord(q.value);show(r.tekst,'b',r.bron);q.value=''}
</script></body></html>
