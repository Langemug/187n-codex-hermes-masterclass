<title>Are you Society?</title>
<style>
  :root { color-scheme:dark; --bg:#000; --fg:#fff; --muted:#6a6a6a; --accent:#7a1fd1; --hot:#b14bff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800; text-transform:uppercase; min-height:100%; display:flex; flex-direction:column; }
  .tape { height:14px; background:repeating-linear-gradient(-45deg,var(--accent) 0 18px,#000 18px 36px); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px; }
  .card { width:100%; max-width:560px; }
  .step { color:var(--hot); font-size:12px; letter-spacing:.35em; margin-bottom:16px; }
  h1 { font-size:clamp(36px,9vw,64px); line-height:.9; letter-spacing:-.03em; font-weight:900; margin-bottom:28px; }
  h1 em { font-style:italic; color:var(--hot); }
  p.sub { color:#c4c4c4; font-size:14px; letter-spacing:.06em; line-height:1.6; margin:-12px 0 28px; text-transform:none; font-weight:700; }
  .opts { display:grid; gap:10px; }
  button { font:inherit; text-transform:uppercase; cursor:pointer; }
  .opt { width:100%; text-align:left; padding:18px 20px; background:#0a0a0a; color:var(--fg); border:2px solid #222; font-size:15px; letter-spacing:.12em; transition:all .1s; }
  .opt:hover, .opt:focus-visible { border-color:var(--hot); outline:none; }
  .opt.sel { background:var(--accent); border-color:var(--accent); }
  .cta { display:inline-block; margin-top:28px; padding:18px 32px; background:var(--accent); color:#fff; border:2px solid var(--accent); font-size:14px; letter-spacing:.25em; }
  .cta:hover { background:#fff; color:#000; border-color:#fff; box-shadow:4px 4px 0 var(--accent); }
  .cta:focus-visible { outline:2px solid var(--hot); outline-offset:3px; }
  .note { margin-top:16px; color:var(--hot); font-size:12px; letter-spacing:.2em; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  .cta:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; background:var(--accent); color:#fff; border-color:var(--accent); }
  .ghost { background:none; border:none; color:var(--muted); font-size:12px; letter-spacing:.3em; margin-top:20px; display:block; }
  .ghost:hover { color:var(--hot); }
  .label { color:var(--muted); font-size:12px; letter-spacing:.3em; margin:24px 0 10px; }
  .sizes { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .sizes .opt { text-align:center; padding:14px 0; }
  .ph { margin-top:20px; border:1px dashed var(--hot); color:var(--hot); padding:10px 12px; font-size:11px; letter-spacing:.15em; line-height:1.5; }
  .result { border-top:1px solid #222; border-bottom:1px solid #222; padding:20px 0; margin-bottom:8px; display:grid; gap:10px; }
  .result div { display:flex; justify-content:space-between; font-size:15px; letter-spacing:.15em; }
  .result span:last-child { color:var(--hot); }
  @media (max-width:420px) { .sizes { grid-template-columns:repeat(3,1fr); } }
</style>

<div class="tape"></div>
<main><div class="card" id="app"></div></main>
<div class="tape"></div>
<script>
const SIZES = ["XS","S","M","L","XL","XXL"];
const Q = [
  { q:"What are you building?", a:["A business","A name","An impact","Nothing yet"] },
  { q:"When nobody's watching, you…", a:["Keep working","Plan the next move","Scroll"] },
  { q:"Think big or act bigger?", a:["Act bigger","Think big"] },
];
const state = { i:-1, answers:[], size:null, fit:null };
const app = document.getElementById("app");

function isSociety() {
  return state.answers[0] !== "Nothing yet" && state.answers[1] !== "Scroll";
}
function advisedSize() {
  const idx = SIZES.indexOf(state.size);
  return state.fit === "less" ? SIZES[Math.max(0, idx - 1)] : state.size;
}
function el(html) { app.innerHTML = html; }

function render() {
  if (state.i === -1) {
    el(`<div class="step">◆ Visionair Society</div>
        <h1>Are you<br><em>Society?</em></h1>
        <p class="sub">Three questions. One honest answer. Then we find your fit.</p>
        <button class="cta" data-go="start">Start</button>`);
  } else if (state.i < Q.length) {
    const { q, a } = Q[state.i];
    el(`<div class="step">Question ${state.i + 1} / ${Q.length}</div>
        <h1>${q}</h1>
        <div class="opts">${a.map(x => `<button class="opt" data-ans="${x}">${x}</button>`).join("")}</div>
        <button class="ghost" data-go="back">← Back</button>`);
  } else if (state.i === Q.length) {
    const s = isSociety();
    el(`<div class="step">Result</div>
        <h1>${s ? "You're<br><em>Society.</em>" : "Not for you.<br><em>Yet.</em>"}</h1>
        <p class="sub">${s ? "You build while the rest talk. Let's find your fit." : "No shame. Every builder starts somewhere. Still want the uniform?"}</p>
        <button class="cta" data-go="next">Find your fit</button>
        <button class="ghost" data-go="back">← Back</button>`);
  } else if (state.i === Q.length + 1) {
    el(`<div class="step">Find your fit</div>
        <h1>Your usual<br><em>size?</em></h1>
        <div class="sizes">${SIZES.map(s => `<button class="opt ${state.size===s?"sel":""}" data-size="${s}">${s}</button>`).join("")}</div>
        <div class="label">How do you want it?</div>
        <div class="opts">
          <button class="opt ${state.fit==="as"?"sel":""}" data-fit="as">Oversized, as designed</button>
          <button class="opt ${state.fit==="less"?"sel":""}" data-fit="less">Less oversized</button>
        </div>
        <div class="ph">Placeholder rule — not based on the real Tapstitch #MW0036 size chart yet.</div>
        <button class="cta" data-go="next" ${state.size && state.fit ? "" : "disabled"}>Show my result</button>
        <button class="ghost" data-go="back">← Back</button>`);
  } else {
    el(`<div class="step">◆ The Visionair Hoodie 01</div>
        <h1>${isSociety() ? "You're <em>Society.</em>" : "Not for you. <em>Yet.</em>"}</h1>
        <div class="result">
          <div><span>Your size</span><span>${advisedSize()}</span></div>
          <div><span>Fit</span><span>${state.fit === "as" ? "Oversized" : "Less oversized"}</span></div>
        </div>
        <div class="ph">Size advice is a placeholder until the real size chart is added.</div>
        <button class="cta" data-go="join">Join the society</button>
        <button class="ghost" data-go="reset">Start over</button>`);
  }
}

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.ans) { state.answers[state.i] = d.ans; state.i++; }
  else if (d.size) state.size = d.size;
  else if (d.fit) state.fit = d.fit;
  else if (d.go === "start" || d.go === "next") state.i++;
  else if (d.go === "back") state.i = Math.max(-1, state.i - 1);
  else if (d.go === "reset") { state.i = -1; state.answers = []; state.size = null; state.fit = null; }
  else if (d.go === "join") { const n = app.querySelector(".note") || app.appendChild(Object.assign(document.createElement("div"), { className:"note" })); n.textContent = "Prototype: the store isn't live yet."; return; }
  render();
});
render();
</script>
