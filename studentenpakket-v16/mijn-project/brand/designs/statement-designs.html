const col = s => s.startsWith('*') ? [s.slice(1), HOT] : [s, W];

function fitLine(x, text, y, maxH, color, opt = {}) {
  const { maxW = 780, squeeze = .68, style = 'plain' } = opt;
  x.save();
  x.font = `900 ${maxH}px ${SANS}`;
  const k = Math.min(1, maxW / (x.measureText(text).width * squeeze));
  x.translate(450, y); x.scale(squeeze * k, k);
  if (style === 'bar') {
    const w = x.measureText(text).width;
    x.fillStyle = HOT; x.fillRect(-w / 2 - 30, -maxH * .82, w + 60, maxH * .98);
    x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fillText(text, 0, 0);
  } else if (style === 'shadow') {
    for (let s = 14; s > 0; s -= 2) { x.fillStyle = s > 2 ? P : HOT; x.fillText(text, s * 1.4, s); }
    x.fillStyle = color; x.fillText(text, 0, 0);
  } else {
    if (style === 'outline') { x.lineJoin = 'round'; x.lineWidth = 22; x.strokeStyle = P; x.strokeText(text, 0, 0); }
    x.fillStyle = color; x.fillText(text, 0, 0);
  }
  x.restore();
  return maxH * k;
}

function stackLines(x, lines, top = 150, bottom = 800, maxW = 780, force = null) {
  const n = lines.length, gap = 18;
  const h = (bottom - top - gap * (n - 1)) / n;
  let y = top;
  lines.forEach(l => {
    const [t, c] = col(l);
    const r = rnd();
    const style = force || (c === HOT && r < .3 ? 'bar' : c === W && r < .35 ? 'outline' : 'plain');
    const used = fitLine(x, t, y + h * .86, h * 1.05, c, { style, maxW });
    y += Math.max(used * .95, h * .7) + gap;
  });
}

function sparkle(x, cx, cy, r, c = W) {
  x.save(); x.fillStyle = c; x.beginPath();
  x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r);
  x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); x.restore();
}

    for (let i = 0; i < 9; i++) { const a = Math.PI + .25 + i * .33; x.strokeStyle = W; x.lineWidth = 6; x.beginPath();
      x.moveTo(450 + Math.cos(a) * 140, y + Math.sin(a) * 120); x.lineTo(450 + Math.cos(a) * 185, y + Math.sin(a) * 160); x.stroke(); } x.restore(); },
  ufo(x, y) { x.fillStyle = 'rgba(177,75,255,.5)'; x.beginPath(); x.moveTo(410, y + 20); x.lineTo(490, y + 20); x.lineTo(590, y + 170); x.lineTo(310, y + 170); x.fill();

    x.fillStyle = HOT; for (let i = -2; i <= 2; i++) { x.beginPath(); x.arc(450 + i * 60, y + 4, 10, 0, 7); x.fill(); } },

    x.fillStyle = HOT; x.beginPath(); x.roundRect(0, -48, 150, 96, [0, 48, 48, 0]); x.fill(); x.restore(); },
};

function roughRect(x, x0, y0, w, h, jag = 14) {
  x.beginPath(); x.moveTo(x0, y0);
  for (let i = 0; i <= 20; i++) x.lineTo(x0 + w * i / 20, y0 + (rnd() - .5) * jag);
  for (let i = 0; i <= 10; i++) x.lineTo(x0 + w + (rnd() - .5) * jag, y0 + h * i / 10);
  for (let i = 20; i >= 0; i--) x.lineTo(x0 + w * i / 20, y0 + h + (rnd() - .5) * jag);
  for (let i = 10; i >= 0; i--) x.lineTo(x0 + (rnd() - .5) * jag, y0 + h * i / 10);
  x.closePath();
}

function circleText(x, text, cx, cy, r, size, color) {
  x.save(); x.font = `900 ${size}px ${SANS}`; x.fillStyle = color; x.textAlign = 'center';
  const step = (Math.PI * 2) / text.length;
  [...text].forEach((ch, i) => { const a = -Math.PI / 2 + i * step;
    x.save(); x.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); x.rotate(a + Math.PI / 2); x.fillText(ch, 0, 0); x.restore(); });
  x.restore();
}

    x.strokeStyle = HOT; x.lineWidth = 6; x.strokeRect(108, 168, 684, 564);
    x.fillStyle = HOT; x.font = `700 34px ${MONO}`; x.textAlign = 'center'; x.fillText('VISIONAIR SOCIETY · ISSUED', 450, 820);

  term: (x, d) => { x.textAlign = 'left'; x.font = `700 52px ${MONO}`;
    d[1].forEach((l, i) => { const [t, c] = col(l); x.fillStyle = c; x.fillText(t, 90, 330 + i * 110); });
    x.fillStyle = HOT; x.fillRect(90, 330 + d[1].length * 110 - 50, 34, 62); x.textAlign = 'center'; },
  bar: (x, d) => { const pct = d[2];
    x.strokeStyle = W; x.lineWidth = 12; x.strokeRect(110, 200, 680, 150);
    const fill = Math.round(pct / 10);
    for (let i = 0; i < fill; i++) { x.fillStyle = HOT; x.fillRect(136 + i * 64, 226, 50, 98); }
    x.fillStyle = W; x.font = `400 64px ${PIX}`; x.fillText(pct + '%', 450, 440);
    d[1].forEach((l, i) => { const [t, c] = col(l); x.fillStyle = c; x.font = `400 96px ${PIX}`;
      const k = Math.min(1, 760 / x.measureText(t).width); x.save(); x.translate(450, 600 + i * 130); x.scale(k, k); x.fillText(t, 0, 0); x.restore(); }); },
  glitch: (x, d) => {
    x.save(); x.translate(-16, 6); x.globalAlpha = .9; stackLines(x, d[1].map(l => '*' + l.replace('*', '')), 180, 760); x.restore();
    seed -= 7; x.save(); stackLines(x, d[1].map(l => l.replace('*', '')), 180, 760); x.restore();
    for (let i = 0; i < 9; i++) { const y = 150 + rnd() * 620, h = 6 + rnd() * 30, dx = (rnd() - .5) * 110;
      const s = x.getImageData(0, Math.round(y * x.S), 900 * x.S, Math.round(h * x.S));
      x.clearRect(0, y, 900, h); x.putImageData(s, Math.round(dx * x.S), Math.round(y * x.S)); }
  },
  sticker: (x, d) => {
    x.save(); x.translate(450, 450); x.rotate((rnd() - .5) * .12); x.translate(-450, -450);
    roughRect(x, 90, 170, 720, 560, 22); x.fillStyle = W; x.fill();
    x.globalCompositeOperation = 'destination-out';
    stackLines(x, d[1].map(l => l.replace('*', '')), 230, 680, 620, 'plain');
    x.restore();
    x.save(); x.translate(560, 760); x.rotate(-.08); roughRect(x, 0, 0, 220, 60, 10); x.fillStyle = HOT; x.fill(); x.restore();
    sparkle(x, 170, 150, 34, HOT); sparkle(x, 760, 800, 22);
  },
  shadow: (x, d) => { stackLines(x, d[1], 150, 760, 760, 'shadow'); sparkle(x, 120, 120, 30, HOT); sparkle(x, 790, 820, 40); sparkle(x, 740, 130, 18); },
  stamp: (x, d) => {
    x.strokeStyle = W; x.lineWidth = 14; x.beginPath(); x.arc(450, 450, 380, 0, 7); x.stroke();
    x.strokeStyle = HOT; x.lineWidth = 6; x.beginPath(); x.arc(450, 450, 270, 0, 7); x.stroke();
    circleText(x, 'VISIONAIR SOCIETY · STAND APART · MOVE TOGETHER · ', 450, 450, 318, 44, W);
    stackLines(x, d[1], 330, 590, 420, 'plain');
    sparkle(x, 450, 655, 26, HOT);
  },
  warning: (x, d) => {
    x.save(); x.beginPath(); x.rect(70, 120, 760, 70); x.rect(70, 720, 760, 70); x.clip();
    for (let i = -10; i < 30; i++) { x.fillStyle = i % 2 ? HOT : 'rgba(0,0,0,0)';
      x.beginPath(); x.moveTo(70 + i * 50, 120); x.lineTo(120 + i * 50, 120); x.lineTo(120 + i * 50 - 670, 790); x.lineTo(70 + i * 50 - 670, 790); x.fill(); }
    x.restore();
    x.strokeStyle = W; x.lineWidth = 10; x.strokeRect(70, 120, 760, 670);
    stackLines(x, d[1], 240, 680, 680);
  },
  redact: (x, d) => {
    x.textAlign = 'left'; x.font = `700 30px ${MONO}`; x.fillStyle = HOT; x.fillText('FILE NO. VS-' + String(Math.floor(rnd() * 9000 + 1000)), 90, 140);
    x.textAlign = 'center';
    stackLines(x, d[1], 190, 640);
    for (let i = 0; i < 4; i++) { x.fillStyle = W; x.fillRect(90 + rnd() * 120, 690 + i * 38, 300 + rnd() * 380, 22); }
  },
  halftone: (x, d) => {
    x.save(); x.fillStyle = HOT;
    for (let yy = 200; yy < 720; yy += 26) for (let xx = 60; xx < 860; xx += 26) {
      const r = 11 * Math.max(0, 1 - Math.hypot(xx - 450, (yy - 460) * 1.4) / 520); if (r > 1) { x.beginPath(); x.arc(xx, yy, r, 0, 7); x.fill(); } }
    x.restore();
    x.save(); x.globalCompositeOperation = 'destination-out'; stackLines(x, d[1].map(l => l.replace('*', '')), 200, 720, 760, 'plain'); x.restore();
    seed -= 3; x.save(); x.translate(-10, -10); stackLines(x, d[1], 200, 720, 760, 'plain'); x.restore();
  },
};

function grunge(x) {
  const S = x.S, N = 900 * S;
  const img = x.getImageData(0, 0, N, N), d = img.data;
  for (let i = 0; i < d.length; i += 4) { if (!d[i + 3]) continue; const r = rnd();
    if (r < .07) d[i + 3] = 0; else if (r < .11) d[i + 3] *= .35; }
  x.putImageData(img, 0, 0);
  x.save(); x.globalCompositeOperation = 'destination-out';
  for (let b = 0; b < 14; b++) { const cx = rnd() * 900, cy = rnd() * 900;
    for (let s = 0; s < 40; s++) { x.globalAlpha = .4 + rnd() * .6; x.beginPath();
      x.arc(cx + (rnd() - .5) * 120, cy + (rnd() - .5) * 60, 1 + rnd() * 6, 0, 7); x.fill(); } }
  for (let i = 0; i < 30; i++) { x.lineWidth = 1 + rnd() * 4; x.globalAlpha = .6 + rnd() * .4;
    const sx = rnd() * 900, sy = rnd() * 900; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + (rnd() - .5) * 300, sy + (rnd() - .5) * 40); x.stroke(); }
  x.restore();
}

function tile(i, S = 1) {
  const t = document.createElement('canvas'); t.width = t.height = 900 * S;
  const x = t.getContext('2d', { willReadFrequently: true });
  x.S = S; x.scale(S, S); x.textAlign = 'center'; seed = 1000 + i * 97;
  draw[D[i][0]](x, D[i]); grunge(x);
  return t;
}

window.sheet = (n) => {
  const c = document.getElementById('c'); c.width = 1500; c.height = 3620;
  const g = c.getContext('2d');
  g.fillStyle = '#07060a'; g.fillRect(0, 0, c.width, c.height); g.textAlign = 'center';
  g.fillStyle = W; g.font = `700 40px ${MONO}`; g.letterSpacing = '12px';
  g.fillText(`VISIONAIR SOCIETY · DESIGNS ${String(n * 10 + 1).padStart(2, '0')}–${String(n * 10 + 10).padStart(2, '0')}`, 750, 90);
  g.letterSpacing = '0px';
  for (let k = 0; k < 10; k++) {
    const i = n * 10 + k, cx = k % 2, ry = Math.floor(k / 2);
    const x0 = 70 + cx * 700, y0 = 150 + ry * 690;
    g.fillStyle = '#000'; g.fillRect(x0, y0 + 60, 660, 600);
    g.drawImage(tile(i), x0 + 30, y0 + 60, 600, 600);
    g.fillStyle = HOT; g.font = `900 46px ${SANS}`; g.fillText(String(i + 1).padStart(2, '0'), x0 + 330, y0 + 46);
  }
  return true;
};
window.print = (i, S) => tile(i, S).toDataURL('image/png');
window.count = () => D.length;

</script>
